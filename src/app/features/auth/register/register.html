 <div class="auth-container">
      <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre">
          </div>

          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input id="apellido" type="text" formControlName="apellido" placeholder="Tu apellido">
          </div>
          
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" formControlName="email" placeholder="tu@email.com">
          </div>

          <div class="form-group">
            <label for="password">Contraseña (Mínimo 6 caracteres)</label>
            <input id="password" type="password" formControlName="password" placeholder="******">
          </div>

          @if (successMessage()) {
            <div class="success-msg">{{ successMessage() }}</div>
          }

          @if (errorMessage()) {
            <div class="error-msg">{{ errorMessage() }}</div>
          }

          <button type="submit" [disabled]="registerForm.invalid || isLoading()">
            {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
          </button>
        </form>
        
        <p class="auth-link">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
        </p>
      </div>
    </div>
